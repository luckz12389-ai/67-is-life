name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        run: |
          mkdir -p app/src/main/java/com/gamerecorder
          cp app-build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt RecorderService.kt app/src/main/java/com/gamerecorder/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameRecorder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
